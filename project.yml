# XcodeGen spec for Coach Bridge (M1–M3).
# Generate the Xcode project on the Mac with:
#   brew install xcodegen && xcodegen generate && open CoachBridge.xcodeproj
# The .xcodeproj is a build product of this file — don't hand-edit it, edit this and regenerate.

name: CoachBridge

options:
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted   # Google/HealthKit types aren't Sendable yet; 'complete' is just noise
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.10.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CoachBridge:
    type: application
    platform: iOS
    sources:
      - path: CoachBridge
      - path: Shared
      - path: SharedPhone
      - path: docs/coach-bridge-privacy-policy.md   # shown in Settings → Privacy policy
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: CoachBridgeWatch        # embedded: installs with the phone app
      - target: CoachBridgeWidgets      # home/lock screen widget and the Live Activity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridge
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/CoachBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - CoachBridgeTests

  # iPhone widget (today's session, go / no-go) and the Live Activity UI.
  CoachBridgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneWidgets
      - path: SharedPhone
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Coach Bridge
        # Must match the phone app's, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CBAppGroup: group.$(BUNDLE_ID_PREFIX).CoachBridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridge.widgets
        CODE_SIGN_ENTITLEMENTS: Support/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # The Watch app: shows the phone's snapshot, sends back how workouts felt. Shares only Shared/.
  CoachBridgeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - target: CoachBridgeWatchWidgets
    info:
      path: Support/Watch-Info.plist
      properties:
        CFBundleDisplayName: Coach Bridge
        # Must match the phone app's, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).CoachBridge
        CBAppGroup: group.$(BUNDLE_ID_PREFIX).CoachBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridge.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Support/Watch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # Complications: next session and race countdown, from the no-health-data glance only.
  CoachBridgeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
    info:
      path: Support/WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Coach Bridge
        # Must match the phone app's, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CBAppGroup: group.$(BUNDLE_ID_PREFIX).CoachBridge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridge.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: Support/WatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  CoachBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoachBridgeTests
    dependencies:
      - target: CoachBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridgeTests
