# XcodeGen spec for Coach Bridge (M1–M3).
# Generate the Xcode project on the Mac with:
#   brew install xcodegen && xcodegen generate && open CoachBridge.xcodeproj
# The .xcodeproj is a build product of this file — don't hand-edit it, edit this and regenerate.

name: CoachBridge

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted   # Google/HealthKit types aren't Sendable yet; 'complete' is just noise
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.8.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CoachBridge:
    type: application
    platform: iOS
    sources:
      - path: CoachBridge
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridge
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/CoachBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - CoachBridgeTests

  CoachBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoachBridgeTests
    dependencies:
      - target: CoachBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).CoachBridgeTests
